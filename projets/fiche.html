<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réalisation | Chhor SISR</title><style>:root{color-scheme:dark;--a:#b9a4ff}*{box-sizing:border-box}body{margin:0;background:#0c0b1c;color:#f6f3ff;font:16px/1.65 system-ui,sans-serif}header,main,footer{width:min(1000px,calc(100% - 36px));margin:auto}header{padding:24px 0;border-bottom:1px solid #514070;display:flex;gap:20px;flex-wrap:wrap}a{color:var(--a)}main{padding:44px 0}h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1.1;letter-spacing:-.04em}section{background:#19152f;border:1px solid #514070;border-radius:18px;padding:24px;margin:18px 0}section h2{margin-top:0;font-size:1.45rem}p,li{color:#c9c1e4}.tag{color:var(--a);text-transform:uppercase;font-weight:700;font-size:.8rem}.tech{display:inline-block;padding:5px 12px;margin:4px;border:1px solid #514070;border-radius:99px}footer{padding:22px 0;border-top:1px solid #514070;color:#c9c1e4}</style></head><body><header><a href="../index.html">CHHOR.SISR</a><a href="../index.html#projets">Projets</a><a href="../index.html#stages">Stages</a></header><main id="content"><p role="status">Chargement de la réalisation…</p></main><footer>Ksatiyarith Patrice Chhor · BTS SIO SISR</footer><script>
(async()=>{const main=document.getElementById('content');const make=(tag,value,cls)=>{const e=document.createElement(tag);if(value)e.textContent=value;if(cls)e.className=cls;return e;};const arr=x=>Array.isArray(x)?x.filter(v=>typeof v==='string'&&v.trim()):[];const sec=(title,value)=>{const s=make('section');s.append(make('h2',title));if(Array.isArray(value)){const u=make('ul');arr(value).forEach(v=>u.append(make('li',v)));if(!u.children.length)return;s.append(u);}else{if(typeof value!=='string'||!value.trim())return;s.append(make('p',value));}main.append(s);};try{const id=new URLSearchParams(location.search).get('id');const r=await fetch('../data/realisations.json',{cache:'no-cache'});if(!r.ok)throw Error();const d=await r.json();const x=d.items.find(v=>v.id===id);if(!x)throw Error();main.replaceChildren(make('p',x.category,'tag'),make('h1',x.title),make('p',x.period),make('p',x.summary));document.title=x.title+' | Chhor SISR';const tech=make('div');arr(x.technologies).forEach(t=>tech.append(make('span',t,'tech')));main.append(tech);sec('Contexte et objectif',x.context);sec('Ma contribution et travaux',x.actions);sec('Compétences concrètes',x.skills);sec('Difficultés et solutions',x.difficulties);sec('Tests et résultats',x.results);sec('Preuves disponibles et limites',x.evidence);sec('Application possible en entreprise',x.business);sec('Bilan',x.reflection);const back=make('a','← Retour aux réalisations');back.href='../index.html#'+(x.type==='stage'?'stages':'projets');main.append(back);}catch{main.replaceChildren(make('h1','Réalisation indisponible'),make('p','Retournez au portfolio pour consulter les autres réalisations.'));}})();
</script></body></html>
